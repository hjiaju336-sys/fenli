<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d1a">
<link rel="icon" href="data:,">
<link rel="manifest" href="/static/manifest.json">
<title>规则怪谈</title>
<style>
:root{--bg:#0d0d1a;--surface:#14142a;--card:#1a1a30;--text:#e8d5c8;--text2:#b8a898;--accent:#b84a5c;--accent-light:#d4708a;--gold:#d4a574;--gold-light:#e8c4a0;--purple:#7b68ae;--border:rgba(180,120,180,.1);--bubble-user:rgba(180,120,180,.12);--bubble-ai:rgba(20,20,40,.8);--font:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:100%;position:relative;overflow:hidden}@media(min-width:481px){#app{max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}}

/* ── D6: 侧栏抽屉 ── */
.side-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:105;opacity:0;pointer-events:none;transition:opacity .3s ease}.side-drawer-overlay.open{opacity:1;pointer-events:auto}
.side-drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:80vw;background:var(--surface);z-index:106;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.5);border-right:1.5px solid var(--border)}.side-drawer.open{transform:translateX(0)}
.side-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;color:var(--gold);flex-shrink:0}
.side-drawer-body{flex:1;overflow-y:auto;padding:12px 16px;font-size:13px}
.side-drawer-body .sd-item{padding:10px 12px;margin:4px 0;background:var(--card);border-radius:8px;font-size:12px;border-left:3px solid var(--gold);cursor:pointer}.side-drawer-body .sd-item:active{background:rgba(255,255,255,.05)}
.side-drawer-body h4{font-size:11px;color:var(--accent);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px}

/* 页面容器 */
.page{display:none;flex-direction:column;flex:1;overflow:hidden;width:100%}.page.active{display:flex}
/* 顶部栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;min-height:50px}
.topbar h1{font-size:17px;font-weight:700;color:var(--gold)}
.topbar .btn-icon{width:36px;height:36px;border:none;border-radius:50%;background:transparent;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 底部Tab栏 */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;color:var(--text2);font-size:10px;cursor:pointer;transition:color .2s;border:none;background:none;font-family:var(--font)}
.tab-item.active{color:var(--gold)}.tab-item .ico{font-size:20px;margin-bottom:2px}

/* 聊天区 */
.chat-area{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.chat-msg{margin:10px 0;display:flex;gap:8px;animation:msgIn .3s ease}
.chat-msg.ai{justify-content:flex-start}.chat-msg.user{justify-content:flex-end}
.chat-msg .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
.chat-msg .avatar img{width:100%;height:100%;object-fit:cover}
.chat-msg .bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;position:relative}
.chat-msg.user .bubble{background:var(--bubble-user);border:1px solid rgba(200,160,60,.2);border-radius:16px 16px 4px 16px}
.chat-msg.ai .bubble{background:var(--bubble-ai);border:1px solid var(--border);border-radius:16px 16px 16px 4px}
.chat-msg.system .bubble{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.15);border-radius:8px;max-width:90%;text-align:center;font-size:12px;color:var(--accent);margin:0 auto;display:block}
.chat-msg .msg-actions{display:none;position:absolute;top:-8px;right:8px;gap:4px}
.chat-msg.user:hover .msg-actions,.chat-msg.user:active .msg-actions{display:flex}
.chat-msg .msg-act{font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}

/* 输入栏 */
.input-bar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.input-bar textarea{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-family:var(--font);font-size:15px;resize:none;min-height:40px;max-height:120px;overflow-y:auto;outline:none;line-height:1.4}.input-bar textarea:focus{border-color:var(--gold)}
.input-bar .btn-send{width:42px;height:42px;border-radius:50%;border:none;background:var(--gold);color:var(--bg);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.input-bar .btn-send:disabled{opacity:.4}

/* 底部面板（变量/世界书） */
.drawer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;z-index:100;transform:translateY(100%);transition:transform .3s ease;max-height:60vh;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.4)}
.drawer.open{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--text2);border-radius:2px;margin:8px auto 0;flex-shrink:0}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--gold)}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px;font-size:13px}

/* 列表项 */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}.list-item:active{background:rgba(255,255,255,.03)}
.list-item .li-title{font-size:15px;font-weight:600}.list-item .li-sub{font-size:12px;color:var(--text2)}
.list-item .li-right{font-size:12px;color:var(--text2);text-align:right}

/* 模板卡片 */
.tpl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:12px 16px;overflow:hidden}
.tpl-card{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;min-height:80px;display:flex;flex-direction:column;justify-content:center}.tpl-card:active{background:rgba(255,255,255,.05)}
.tpl-card .tpl-name{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:4px}
.tpl-card .tpl-rank{font-size:11px;color:var(--accent)}.tpl-card .tpl-desc{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 按钮 */
.btn{padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#e04040);color:#fff}.btn-primary:active{opacity:.8}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--bg)}.btn-gold:active{opacity:.8}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:active{background:rgba(255,255,255,.05)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:14px}
.btn-block{display:block;width:100%;text-align:center;margin:8px 0}

/* 输入框 */
.m-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:var(--font);font-size:14px;outline:none}.m-input:focus{border-color:var(--gold)}
.m-input-row{margin-bottom:12px}.m-input-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal h3{font-size:16px;color:var(--gold);margin-bottom:12px}
.modal .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;animation:toastIn .3s ease;pointer-events:none;white-space:nowrap}
.toast-success{background:#2e7d32;color:#fff}.toast-error{background:#c62828;color:#fff}.toast-info{background:#1565c0;color:#fff}
/* ── Hook效果动画 ── */
@keyframes flashRed{0%,100%{box-shadow:inset 0 0 60px rgba(255,0,0,.5)}50%{box-shadow:inset 0 0 0px rgba(255,0,0,0)}}
@keyframes screenShake{0%,100%{transform:translate(0)}10%{transform:translate(-3px,1px)}20%{transform:translate(3px,-1px)}30%{transform:translate(-2px,-2px)}40%{transform:translate(2px,1px)}50%{transform:translate(-1px,-1px)}60%{transform:translate(1px,1px)}70%{transform:translate(-1px,0)}80%{transform:translate(1px,0)}90%{transform:translate(0,1px)}}
@keyframes goldenGlow{0%,100%{box-shadow:0 0 15px rgba(212,160,64,.3),inset 0 0 20px rgba(212,160,64,.1)}50%{box-shadow:0 0 30px rgba(212,160,64,.5),inset 0 0 40px rgba(212,160,64,.2)}}
@keyframes vignettePulse{0%,100%{box-shadow:inset 0 0 60px rgba(0,0,0,.5)}50%{box-shadow:inset 0 0 100px rgba(0,0,0,.8)}}
@keyframes bloodEdge{0%{box-shadow:inset 0 0 0px rgba(180,74,92,0)}100%{box-shadow:inset 0 0 50px rgba(180,74,92,.5)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes endingCardIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.hook-flash-red{animation:flashRed .3s ease-in-out 3}
.hook-screen-shake{animation:screenShake .4s ease-in-out}
.hook-golden-glow{animation:goldenGlow 3s ease-in-out}
.hook-vignette-pulse{animation:vignettePulse 3s ease-in-out}
.hook-blood-edge{animation:bloodEdge 3s ease-in-out forwards}
.hook-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:250;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.hook-portrait-popup{text-align:center;max-width:90vw;padding:20px}.hook-portrait-popup img{max-width:160px;max-height:220px;object-fit:contain;border-radius:8px;border:2px solid var(--gold);margin-bottom:10px}.hook-portrait-popup .npc-line{font-size:15px;color:var(--text);line-height:1.6;margin:8px 0}
.hook-ending-card{text-align:center;padding:24px 16px;background:var(--surface);border:2px solid var(--gold);border-radius:12px;max-width:90vw}.hook-ending-card .end-icon{font-size:48px;margin-bottom:8px}.hook-ending-card .end-title{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:6px}.hook-ending-card .end-desc{font-size:14px;color:var(--text);margin-bottom:12px}
.hook-note-card{max-width:90vw;padding:16px;border-radius:8px;border:2px solid;font-size:13px;line-height:1.6}.hook-note-card.parchment{background:#f5e6c8;color:#3a2a10;border-color:#c8a060}.hook-note-card.medical{background:#e8f0e8;color:#1a3a1a;border-color:#6a9060;font-family:monospace}.hook-note-card.diary{background:#f0e0e8;color:#3a1a2a;border-color:#c080a0}
.hook-clue-image{max-width:95vw;text-align:center}.hook-clue-image img{max-width:100%;max-height:50vh;object-fit:contain;border-radius:6px;border:2px solid var(--border)}.hook-clue-image .caption{font-size:12px;color:var(--text2);margin-top:6px}
.hook-binary-choice{max-width:90vw;text-align:center;padding:16px;background:var(--surface);border:2px solid var(--accent);border-radius:10px}.hook-binary-choice .bc-btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.hook-fullscreen-text{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;letter-spacing:3px;animation:fadeIn .5s ease;pointer-events:none;padding:20px;text-align:center}.hook-fullscreen-text.normal{color:var(--text)}.hook-fullscreen-text.blood{color:var(--accent)}.hook-fullscreen-text.gold{color:var(--gold)}
.hook-chapter-title{text-align:center;padding:16px;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:4px;animation:fadeIn .8s ease}
.hook-scene-transition{text-align:center;padding:12px;font-size:14px;color:var(--text2);font-style:italic;letter-spacing:2px}
.degrade-notice{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(60,30,30,.9);color:#f0c0a0;padding:6px 14px;border-radius:16px;font-size:11px;animation:fadeIn .3s ease;pointer-events:none;white-space:nowrap;border:1px solid rgba(200,100,80,.4)}
.particle{position:fixed;pointer-events:none;z-index:240;animation:floatUp 4s ease-out forwards}
.fav-float{position:fixed;z-index:255;font-size:18px;font-weight:700;pointer-events:none;animation:floatUp 2s ease-out forwards}
.input-lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px}.input-lock-overlay .lock-text{font-size:14px;color:var(--accent);margin-bottom:8px;text-align:center;padding:0 16px}.input-lock-overlay .lock-timer{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:8px}.input-lock-overlay .lock-close{position:absolute;top:8px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:rgba(0,0,0,.6);color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}.input-lock-overlay .lock-keyword-input{width:180px;padding:6px 10px;border:1.5px solid var(--gold);border-radius:4px;background:rgba(0,0,0,.5);color:var(--text);font-size:13px;text-align:center;margin-top:8px}
.comfort-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--text2)}.comfort-switch{position:relative;width:42px;height:24px;flex-shrink:0}.comfort-switch input{opacity:0;width:0;height:0}.comfort-switch .slider{position:absolute;cursor:pointer;inset:0;background:#555;border-radius:24px;transition:.3s}.comfort-switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#ccc;border-radius:50%;transition:.3s}.comfort-switch input:checked+.slider{background:var(--accent)}.comfort-switch input:checked+.slider::before{transform:translateX(18px);background:#fff}
/* 骨架屏/AI思考动画 */
.skeleton{display:flex;gap:8px;padding:10px 0;animation:skPulse 1.5s ease-in-out infinite}.skeleton .sk-avatar{width:36px;height:36px;border-radius:50%;background:var(--card)}
.skeleton .sk-lines{flex:1;display:flex;flex-direction:column;gap:6px}.skeleton .sk-line{height:12px;border-radius:6px;background:var(--card)}.skeleton .sk-line.short{width:60%}
@keyframes skPulse{0%,100%{opacity:.5}50%{opacity:1}}
/* 离线提示 */
.offline-banner{display:none;background:#c62828;color:#fff;text-align:center;padding:6px 12px;font-size:12px;flex-shrink:0}.offline-banner.show{display:block}
/* ── 思考动画三点跳动 ── */
.thinking-dots{display:inline-flex;gap:3px;vertical-align:middle;align-items:center;margin-left:4px}
.thinking-dots span{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:dotBounce 1.2s ease-in-out infinite}
.thinking-dots span:nth-child(1){animation-delay:0s}.thinking-dots span:nth-child(2){animation-delay:.2s}.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-6px);opacity:1}}
/* ── N1: 规则触发闪烁 ── */
@keyframes ruleFlash{0%,100%{box-shadow:inset 0 0 0 transparent}25%,75%{box-shadow:inset 0 0 100px rgba(220,40,40,.65)}}body.rule-triggered{animation:ruleFlash .6s ease-in-out 2;pointer-events:none}
/* 内联错误+重试 */
.msg-error{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:8px 0;background:rgba(198,40,40,.12);border:1px solid rgba(198,40,40,.25);border-radius:8px;font-size:12px;color:#e88}.msg-error button{flex-shrink:0;padding:4px 12px;border:1px solid #e88;border-radius:12px;background:transparent;color:#e88;font-size:11px;cursor:pointer}
/* 引号高亮 */
.quote-hl{color:var(--gold);font-weight:600}

/* 加载 */
.loading{text-align:center;padding:20px;color:var(--text2);font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}

@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 滚动条 */
::-webkit-scrollbar{width:0}
/* ── M4: 网络断开遮罩 ── */
.ws-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.78);align-items:center;justify-content:center;flex-direction:column;gap:16px}
.ws-overlay.active{display:flex}
.ws-overlay .ws-text{color:var(--text);font-size:15px;font-family:var(--font);text-align:center;line-height:1.6;padding:0 20px}
.ws-overlay .ws-spinner{width:36px;height:36px;border:3px solid rgba(212,160,64,.25);border-top-color:var(--gold);border-radius:50%;animation:wsSpin .8s linear infinite}
.ws-overlay .ws-text.clickable{cursor:pointer;text-decoration:underline;color:var(--gold);transition:color .2s}
.ws-overlay .ws-text.clickable:active{color:#fff}
@keyframes wsSpin{to{transform:rotate(360deg)}}
/* ── M5: 加载更多提示 ── */
.load-more-hint{text-align:center;padding:14px;font-size:12px;color:var(--text2);user-select:none}
.load-more-hint:active{color:var(--gold)}
</style></head>
<body>
<!-- M4: 网络断开遮罩 -->
<div class="ws-overlay" id="ws-overlay"><div class="ws-spinner"></div><div class="ws-text" id="ws-text">网络已断开，正在重连...</div></div>
<div id="app">
 <!-- 登录页 -->
 <div class="page active" id="pg-login">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
   <div style="font-size:48px;margin-bottom:16px">🌙</div>
   <div style="font-size:24px;font-weight:700;color:var(--gold);margin-bottom:4px">规则怪谈</div>
   <div style="font-size:13px;color:var(--text2);margin-bottom:32px">AI驱动的无限流悬疑叙事</div>
   <div style="width:100%;max-width:300px">
    <div class="m-input-row"><input type="text" id="lg-user" class="m-input" placeholder="用户名" autocomplete="username"></div>
    <div class="m-input-row"><input type="password" id="lg-pass" class="m-input" placeholder="密码"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()" style="margin-top:12px">登录</button>
    <button class="btn btn-outline btn-block" onclick="doRegister()" style="margin-top:8px">注册新账号</button>
   </div>
  </div>
  <div style="text-align:center;padding:16px;font-size:11px;color:var(--text2)">本平台内容为AI生成，纯属虚构 · 适合16岁以上</div>
 </div>

 <!-- 首页 -->
 <div class="page" id="pg-home">
  <div class="topbar"><h1>规则怪谈</h1><button class="btn-icon" onclick="showModal('modal-settings')">⚙</button></div>
  <div style="flex:1;overflow-y:auto;padding:16px">
   <button class="btn btn-gold btn-block" onclick="quickStart()" style="padding:14px;font-size:16px;margin-bottom:12px">⚡ 快速开始</button>
   <button class="btn btn-outline btn-block" onclick="openSaves()">💾 继续游戏</button>
   <div style="margin-top:20px">

<script>
// ═══ 全局状态 ═══
var _token='',_user='',_apikey1='',_apikey2='',_ws=null,_busy=false,_turnCount=0,_nValue=5;
var _curPage='pg-login',_detailType='',_detailId='',_worldBook=[],_lastTags={};
/* ── M4: WS重连管理 ── */
var _wsFailTimer=null,_wsEverConnected=false;
/* ── M5: 消息分页 ── */
var _allMsgs=[],_msgsShown=0,_msgsPageSize=20;
var LG={get:function(k,d){try{var v=localStorage.getItem('m_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){localStorage.setItem('m_'+k,JSON.stringify(v))},getS:function(k,d){return localStorage.getItem('m_'+k)||d},setS:function(k,v){localStorage.setItem('m_'+k,v)}};
(function(){
  _token=LG.getS('token','');_user=LG.getS('user','');
  _apikey1=LG.getS('apikey1','');_apikey2=LG.getS('apikey2','');
  _nValue=parseInt(LG.getS('nvalue','5'))||5;
  document.getElementById('lg-user').value=LG.getS('last_user','');
  document.getElementById('lg-pass').value='';
  var theme=LG.getS('theme','dark');setTheme(theme,true);
  var nv=document.getElementById('chat-nval');if(nv)nv.value=_nValue;
  if(_token){navigateTo('pg-home');checkAdmin()}
  loadMComfortUI();
})();


// 离线检测
window.addEventListener('online',function(){var b=document.getElementById('offline-banner');if(b)b.classList.remove('show')});
window.addEventListener('offline',function(){var b=document.getElementById('offline-banner');if(b)b.classList.add('show')});
// ═══ 工具函数 ═══
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function _getMyWorldBook(){try{return JSON.parse(localStorage.getItem('mvp_my_worldbook')||'[]')}catch(e){return[]}}
function _auth(){return _token||LG.getS('token','')}

// 全局 fetch 包装：统一 401 + 网络异常 + JSON 解析
async function _fetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (!opts.headers['Authorization']) {
    opts.headers['Authorization'] = 'Bearer ' + _auth();
  }
  try {
    var resp = await fetch(url, opts);
    if (resp.status === 401) {
      LG.remove('token');
      _token = '';
      toast('登录已过期，请重新登录','error');
      setTimeout(function() { navigateTo('pg-login'); }, 1500);
      throw new Error('Unauthorized');
    }
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data;
  } catch (e) {
    if (e.message !== 'Unauthorized') {
      toast('网络错误: ' + e.message, 'error');
    }
    throw e;
  }
}
function toast(msg,type){var t=document.createElement('div');t.className='toast toast-'+(type||'info');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}
function showConfirm(msg,cb){document.getElementById('confirm-msg').textContent=msg;document.getElementById('confirm-yes').onclick=function(){closeModal('modal-confirm');cb()};document.getElementById('modal-confirm').classList.add('active')}
function showModal(id){document.getElementById(id).classList.add('active');if(id==='modal-api'){var k1=document.getElementById('cfg-key1'),k2=document.getElementById('cfg-key2');if(!k1.value)k1.value=_apikey1||LG.getS('apikey1','');if(!k2.value)k2.value=_apikey2||LG.getS('apikey2','')}}
function closeModal(id){document.getElementById(id).classList.remove('active')}

// ═══ 导航 ═══
function navigateTo(pgId){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.drawer').forEach(function(d){d.classList.remove('open')});
  var el=document.getElementById(pgId);if(el)el.classList.add('active');
  _curPage=pgId;
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-pg')===pgId)});
  var showTab=pgId==='pg-home'||pgId==='pg-templates'||pgId==='pg-saves'||pgId==='pg-profile';
  document.getElementById('tabbar').style.display=showTab?'flex':'none';
  if(pgId==='pg-templates')loadTemplates('preset');
  if(pgId==='pg-saves')loadSaves();
  if(pgId==='pg-profile')loadProfile();
  if(pgId==='pg-chat')connectWS();
}
function openDrawer(type){
  var d=document.getElementById('drawer-'+type);if(!d)return;
  d.classList.add('open');
  if(type==='vars')renderVars();
  if(type==='wb')renderWorldBook();
}
function closeDrawer(){document.querySelectorAll('.drawer').forEach(function(d){d.classList.remove('open')})}

// ═══ 鉴权 ═══
function doLogin(){
  var u=document.getElementById('lg-user').value.trim(),p=document.getElementById('lg-pass').value.trim();
  if(!u||!p){toast('请填写用户名和密码','error');return}
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(function(r){return r.json()}).then(function(d){
    if(d.token){_token=d.token;_user=d.username;LG.setS('token',d.token);LG.setS('user',d.username);LG.setS('last_user',u);toast('登录成功','success');navigateTo('pg-home');checkAdmin()}else toast(d.error||'登录失败','error')
  }).catch(function(e){toast('网络错误','error')})
}
function doRegister(){
  var u=document.getElementById('lg-user').value.trim(),p=document.getElementById('lg-pass').value.trim();
  if(!u||!p){toast('请填写用户名和密码','error');return}
  fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(function(r){return r.json()}).then(function(d){
    if(d.token){_token=d.token;_user=d.username;LG.setS('token',d.token);LG.setS('user',d.username);LG.setS('last_user',u);toast('注册成功','success');navigateTo('pg-home')}else toast(d.error||'注册失败','error')
  }).catch(function(e){toast('网络错误','error')})
}
function checkAdmin(){fetch('/api/user/profile',{headers:{'Authorization':'Bearer '+_auth()}}).then(function(r){return r.json()}).then(function(d){var b=document.getElementById('btn-admin-home');if(b)b.style.display=d.is_admin?'block':'none'})}

// ═══ D6: 侧栏抽屉 ═══
function openSideDrawer(){
  document.getElementById('side-drawer').classList.add('open');
  document.getElementById('side-drawer-overlay').classList.add('open');
  renderSideDrawer();
  var sd=document.getElementById('side-drawer');
  sd._touchStartX=null;sd._touchStartY=null;
  sd.addEventListener('touchstart',_sdTouchStart,{passive:true});
  sd.addEventListener('touchend',_sdTouchEnd,{passive:true});
}
function closeSideDrawer(){
  document.getElementById('side-drawer').classList.remove('open');
  document.getElementById('side-drawer-overlay').classList.remove('open');
  var sd=document.getElementById('side-drawer');
  sd.removeEventListener('touchstart',_sdTouchStart);
  sd.removeEventListener('touchend',_sdTouchEnd);
}
function toggleSideDrawer(){
  var sd=document.getElementById('side-drawer');
  sd.classList.contains('open')?closeSideDrawer():openSideDrawer();
}
function _sdTouchStart(e){var sd=document.getElementById('side-drawer');sd._touchStartX=e.touches[0].clientX;sd._touchStartY=e.touches[0].clientY}
function _sdTouchEnd(e){
  var sd=document.getElementById('side-drawer');if(sd._touchStartX==null)return;
  var dx=e.changedTouches[0].clientX-sd._touchStartX,dy=e.changedTouches[0].clientY-sd._touchStartY;
  if(dx<-80&&Math.abs(dx)>Math.abs(dy))closeSideDrawer();
  sd._touchStartX=null;sd._touchStartY=null;
}
function renderSideDrawer(){
  var el=document.getElementById('sd-player-cards');if(!el)return;
  var pd=window._lastPlayerDetail||{};var html='';
  var skip=['是否玩家','is_player','外貌','appearance','扩展信息','头像','avatar'];
  for(var k in pd){if(!pd.hasOwnProperty(k)||skip.indexOf(k)>=0)continue;var v=pd[k];if(Array.isArray(v))v=v.join(', ');else if(typeof v==='object'&&v!==null)v=JSON.stringify(v).substring(0,50);v=esc(String(v));if(v.length>40)v=v.substring(0,40)+'...';html+='<div class=\"sd-item\">'+esc(k)+': <b>'+v+'</b></div>'}
  el.innerHTML=html||'<div class=\"sd-item\">暂无数据</div>';
  // 变量面板
  var vEl=document.getElementById('sd-vars-section');if(!vEl)return;
  var tags=window._lastTags||{};var vhtml='';
  var cats={world:'当前副本',map:'地图',rule:'规则',character:'角色',item:'物品'};
  for(var ck in cats){var list=tags[ck]||[];if(!list.length)continue;vhtml+='<h4>'+cats[ck]+'</h4>';for(var i=0;i<list.length;i++){var t=list[i];vhtml+='<div class=\"sd-item\" style=\"border-left-color:var(--accent);font-size:11px\">'+esc(t.tag_name||'')+'<br><span style=\"color:var(--text2);font-size:10px\">'+esc((t.tag_hint||'').substring(0,40))+'</span></div>'}}
  vEl.innerHTML=vhtml||'';
}

// ═══ 设置 ═══
function setTheme(name,silent){
  var root=document.documentElement.style;
  if(name==='light'){root.setProperty('--bg','#f5f0e8');root.setProperty('--surface','#fff');root.setProperty('--card','#f0ebe0');root.setProperty('--text','#2a2010');root.setProperty('--text2','#8a8070')}
  else if(name==='sepia'){root.setProperty('--bg','#2a1a0a');root.setProperty('--surface','#3a2a18');root.setProperty('--card','#2a1a10');root.setProperty('--text','#e8d8c0');root.setProperty('--text2','#a89070')}
  else{root.setProperty('--bg','#0d0d1a');root.setProperty('--surface','#14142a');root.setProperty('--card','#1a1a30');root.setProperty('--text','#e0d8c8');root.setProperty('--text2','#908878')}
  LG.setS('theme',name);document.getElementById('cfg-theme').value=name;
  if(!silent)toast('主题已切换','success')
}
function saveSettings(){
  closeModal('modal-settings');toast('设置已保存','success')
}
function saveApiConfig(){
  _apikey1=document.getElementById('cfg-key1').value.trim();_apikey2=document.getElementById('cfg-key2').value.trim();

function showWSOverlay(){document.getElementById('ws-overlay').classList.add('active');document.getElementById('ws-text').textContent='网络已断开，正在重连...';document.getElementById('ws-text').classList.remove('clickable');document.getElementById('ws-text').onclick=null}
function hideWSOverlay(){document.getElementById('ws-overlay').classList.remove('active');clearTimeout(_wsFailTimer);_wsFailTimer=null}
function wsReconnectFailed(){document.getElementById('ws-text').textContent='重连失败，点击刷新';document.getElementById('ws-text').classList.add('clickable');document.getElementById('ws-text').onclick=function(){location.reload()}}
function connectWS(){
  if(_ws&&_ws.readyState===WebSocket.OPEN)return;
  var tok=_token||LG.getS('token','');_ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws?token='+encodeURIComponent(tok));
  _ws.onopen=function(){document.getElementById('chat-status').textContent='已连接';document.getElementById('chat-status').style.color='#4a4';hideWSOverlay();if(_wsEverConnected)toast('已重连','success');_wsEverConnected=true;clearTimeout(_wsFailTimer);_wsFailTimer=null};
  _ws.onclose=function(){_busy=false;if(_curPage==='pg-chat'){document.getElementById('chat-status').textContent='断开,重连中...';document.getElementById('chat-status').style.color='#a44';showWSOverlay();setTimeout(connectWS,3000);if(!_wsFailTimer)_wsFailTimer=setTimeout(wsReconnectFailed,30000)}};
  _ws.onmessage=function(ev){try{handleWS(JSON.parse(ev.data))}catch(e){console.error('WS parse error:',e)}}
}

function highlightMQ(text){
  var safe=esc(text);
  // \n → <br> 换行渲染（在 esc 之后，保证 XSS 安全）
  safe=safe.replace(/\n/g,'<br>');
  safe=safe.replace(/&quot;(.*?)&quot;/g,'<span class="quote-hl">"$1"</span>');
  safe=safe.replace(/「(.*?)」/g,'<span class="quote-hl">「$1」</span>');
  return safe;
}
// ── N4: NPC名字高亮 ──
function highlightMNPCs(html){
  var chars=window._lastTags&&window._lastTags.character||[];
  if(!chars.length)return html;
  var names=[],seen={};
  var npcColors=['#d4a574','#b84a5c','#7b68ae','#6a9aca','#68ae8a','#ca9a6a','#ae688a','#8aae68'];
  for(var i=0;i<chars.length;i++){
    var n=chars[i].tag_name||'';
    if(n&&!seen[n]&&n.length>=2&&n!=='玩家'&&n!=='你'&&n!=='自己'){seen[n]=true;names.push(n)}
  }
  if(!names.length)return html;
  names.sort(function(a,b){return b.length-a.length});
  for(var j=0;j<names.length;j++){
    var nm=names[j],color=npcColors[j%npcColors.length];
    var escapedName=nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var re=new RegExp('('+escapedName+')','g');
    html=html.replace(re,'<span style="color:'+color+';font-weight:700;text-shadow:0 0 6px '+color+'44">$1</span>');
  }
  return html;
}

function handleWS(d){
  if(d.type==='init_state'){
    document.getElementById('chat-world').textContent=d.world_name||'未知副本';
    if(d.world_book)_worldBook=d.world_book;
    if(d.all_tags_by_category)_lastTags=d.all_tags_by_category;
    // D6: 更新侧栏抽屉
    if(d.world_name){var sn=document.getElementById('sd-world-name');if(sn)sn.textContent=d.world_name}
    if(d.world_desc){var sd2=document.getElementById('sd-world-desc');if(sd2)sd2.textContent=d.world_desc}
    window._lastPlayerDetail=d.player_detail||{};
    if(d.player_detail){var pd=d.player_detail;var pdEl=document.getElementById('chat-pdetail');if(pdEl){pdEl.style.display='inline';pdEl.textContent='❤️ '+(pd.hp!=null?pd.hp:'?')+'/'+(pd.max_hp!=null?pd.max_hp:'?')+' | 🧠 '+(pd.sanity!=null?pd.sanity:'?')+'/'+(pd.max_sanity!=null?pd.max_sanity:'?')}}
    var msgs=document.getElementById('chat-msgs'),html='';
    var saved=window._savedMessages||[];
    if(saved.length>0){
      for(var si=0;si<saved.length;si++){var sm=saved[si];html+=renderMsg(sm.role==='user'?'user':(sm.role==='ai'?'ai':'system'),sm.content)}
      window._savedMessages=null;
    }else if(d.world_intro){html+=renderMsg('system',d.world_intro)}
    if(d.opening_monologue&&!saved.length)html+=renderMsg('ai',d.opening_monologue);
    msgs.innerHTML=html;scrollChat();
    _setupMsgPagination();_initMsgBuffer();
  }else if(d.type==='narrative_chunk'){
    var msgs=document.getElementById('chat-msgs'),last=msgs.lastElementChild;
    if(!last||!last.classList.contains('chat-msg')||!last.classList.contains('ai')){last=document.createElement('div');last.className='chat-msg ai';last.innerHTML='<div class="avatar">🤖</div><div class="bubble"></div>';msgs.appendChild(last)}
    // 流式阶段用 textContent 避免换行闪烁，完整渲染在 turn_complete 处理
    var skEl=document.getElementById('chat-msgs').querySelector('.skeleton');if(skEl)skEl.remove();last.querySelector('.bubble').textContent+=d.text;scrollChat()
  }else if(d.type==='turn_complete'){
    var skEl2=document.getElementById('chat-msgs').querySelector('.skeleton');if(skEl2)skEl2.remove();_busy=false;_turnCount++;document.getElementById('btn-send').style.display='flex';document.getElementById('btn-stop').style.display='none';
    document.getElementById('chat-status').textContent='OK '+(d.latency_ms||0)+'ms';
    document.getElementById('chat-status').style.color='#4a4';
    if(d.all_tags_by_category)_lastTags=d.all_tags_by_category;
    var lastBubble=document.getElementById('chat-msgs').querySelector('.chat-msg.ai:last-child .bubble');
    if(lastBubble){var _mhq=highlightMQ(lastBubble.textContent);_mhq=highlightMNPCs(_mhq);lastBubble.innerHTML=_mhq;_allMsgs.push({role:'ai',content:lastBubble.textContent,turn:_turnCount});_msgsShown++}
    if(d.ending_type&&d.ending_type!=='none')showEnding(d.ending_type,d.ending_desc||'')
  }else if(d.type==='hook_effects'){
    if(d.effects&&d.effects.length){
      // N1: 规则触发检测——红色边框闪烁+震动
      for(var _n1i=0;_n1i<d.effects.length;_n1i++){var _ef2=d.effects[_n1i];if(_ef2&&(_ef2.type==='rule_reveal'||_ef2.type==='flash_red'||_ef2.type==='blood_edge')){document.body.classList.add('rule-triggered');if(window.navigator&&navigator.vibrate)navigator.vibrate(200);setTimeout(function(){document.body.classList.remove('rule-triggered')},1300);break}}
      d.effects.sort(function(a,b){return(b.priority||0)-(a.priority||0)});
      renderMHookEffects(d.effects,0);
    }
  }else if(d.type==='error'){var skEl3=document.getElementById('chat-msgs').querySelector('.skeleton');if(skEl3)skEl3.remove();_busy=false;document.getElementById('btn-send').style.display='flex';document.getElementById('btn-stop').style.display='none';document.getElementById('chat-status').textContent='错误';var errDiv=document.createElement('div');errDiv.className='msg-error';errDiv.innerHTML='<span>⚠ '+esc((d.message||'AI调用失败'))+'</span> <button onclick="this.parentElement.remove();mRetrySend()">点击重试</button>';document.getElementById('chat-msgs').appendChild(errDiv);scrollChat();toast(d.message,'error')}
  else if(d.type==='cancelled'){var skEl4=document.getElementById('chat-msgs').querySelector('.skeleton');if(skEl4)skEl4.remove();_busy=false;document.getElementById('btn-send').style.display='flex';document.getElementById('btn-stop').style.display='none';document.getElementById('chat-status').textContent='已取消';toast('生成已取消','info')}
}
function renderMsg(role,content,turn){
  var avatar=role==='user'?'👤':(role==='ai'?'🤖':'🌙');
  var html='<div class="chat-msg '+role+'"'+(turn!=null?' data-turn="'+turn+'"':'')+'>';
  if(role!=='system')html+='<div class="avatar">'+avatar+'</div>';
  html+='<div class="bubble">'+(role==='ai'?highlightMQ(content):esc(content));
  if(role==='user')html+='<div class="msg-actions"><button class="msg-act" onclick="editMsg(this)">✎</button><button class="msg-act" onclick="rollbackMsg(this)">↩</button></div>';
  html+='</div></div>';
  return html
}
/* ── M5: 历史消息上拉加载分页 ── */
function _setupMsgPagination(){
  var chatEl=document.getElementById('chat-msgs');if(!chatEl)return;
  chatEl.addEventListener('scroll',function(){
    if(chatEl.scrollTop<50&&_allMsgs.length>_msgsShown&&!_msgLoadingMore)loadMoreMsgs();
  });
}
var _msgLoadingMore=false;
function _scrollChatBottom(){var c=document.getElementById('chat-msgs');if(c)c.scrollTop=c.scrollHeight}
function loadMoreMsgs(){
  if(_msgLoadingMore)return;_msgLoadingMore=true;
  var chatEl=document.getElementById('chat-msgs');if(!chatEl){_msgLoadingMore=false;return}
  var newShown=Math.min(_allMsgs.length,_msgsShown+_msgsPageSize);
  if(newShown<=_msgsShown){_msgLoadingMore=false;return}
  var oldH=chatEl.scrollHeight;
  var start=_allMsgs.length-newShown,end=_allMsgs.length-_msgsShown;
  var frag='';
  for(var i=start;i<end;i++){
    var m=_allMsgs[i];
    frag+=renderMsg(m.role,m.content,m.turn);
  }
  var hint=chatEl.querySelector('.load-more-hint');if(hint)hint.remove();
  chatEl.insertAdjacentHTML('afterbegin',frag);
  chatEl.scrollTop=chatEl.scrollHeight-oldH;
  _msgsShown=newShown;
  if(_msgsShown>=_allMsgs.length){
    chatEl.insertAdjacentHTML('afterbegin','<div class="load-more-hint" style="color:var(--text2)">—— 没有更多消息了 ——</div>');
  }else{
    chatEl.insertAdjacentHTML('afterbegin','<div class="load-more-hint" onclick="loadMoreMsgs()">↑ 加载更早的消息 ('+(_allMsgs.length-_msgsShown)+'条)</div>');
  }
  _msgLoadingMore=false;
}
function _initMsgBuffer(){
  var chatEl=document.getElementById('chat-msgs');if(!chatEl)return;
  _allMsgs=[];
  var children=chatEl.children;
  for(var i=0;i<children.length;i++){
    var c=children[i];
    if(c.classList.contains('chat-msg')&&c.classList.contains('user')){
      _allMsgs.push({role:'user',content:c.querySelector('.bubble')?c.querySelector('.bubble').textContent:'',turn:parseInt(c.getAttribute('data-turn'))||0});
    }else if(c.classList.contains('chat-msg')&&c.classList.contains('ai')){
      _allMsgs.push({role:'ai',content:c.querySelector('.bubble')?c.querySelector('.bubble').textContent:'',turn:0});
    }else if(c.classList.contains('chat-msg')&&c.classList.contains('system')){
      _allMsgs.push({role:'system',content:c.querySelector('.bubble')?c.querySelector('.bubble').textContent:c.textContent,turn:0});
    }
  }
  if(_allMsgs.length>_msgsPageSize){
    _msgsShown=_msgsPageSize;
    chatEl.innerHTML='';
    var start=_allMsgs.length-_msgsShown;
    for(var j=start;j<_allMsgs.length;j++){
      var m2=_allMsgs[j];chatEl.innerHTML+=renderMsg(m2.role,m2.content,m2.turn);
    }
    chatEl.insertAdjacentHTML('afterbegin','<div class="load-more-hint" onclick="loadMoreMsgs()">↑ 加载更早的消息 ('+(_allMsgs.length-_msgsShown)+'条)</div>');
  }else{
    _msgsShown=_allMsgs.length;
    chatEl.insertAdjacentHTML('afterbegin','<div class="load-more-hint" style="color:var(--text2)">—— 没有更多消息了 ——</div>');
  }
  _scrollChatBottom();
}
function sendMsg(){
  var inp=document.getElementById('chat-input'),msg=inp.value.trim();
  if(!msg||_busy)return;
  var ak1=_apikey1||LG.getS('apikey1','');if(!ak1){toast('请先设置API Key','error');return}
  var ak2=_apikey2||LG.getS('apikey2','');if(!ak2)ak2=ak1;
  if(!_ws||_ws.readyState!==WebSocket.OPEN){connectWS();setTimeout(function(){sendMsg()},800);return}
  inp.value='';inp.style.height='auto';_busy=true;window._lastUserInput=msg;document.getElementById('btn-send').style.display='none';document.getElementById('btn-stop').style.display='flex';
  document.getElementById('chat-msgs').innerHTML+=renderMsg('user',msg,_turnCount);scrollChat();
  _allMsgs.push({role:'user',content:msg,turn:_turnCount});_msgsShown++;
  var m1=LG.getS('model1','deepseek-v4-flash'),m2=LG.getS('model2','deepseek-v4-pro');
  // 显示骨架动画
  var sk=document.createElement('div');sk.className='skeleton';sk.innerHTML='<div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div>';
  document.getElementById('chat-msgs').appendChild(sk);scrollChat();
  _ws.send(JSON.stringify({type:'user_turn',userInput:msg,apiKey1:ak1,apiKey2:ak2,modelSmall:m1,modelLarge:m2,nValue:_nValue,myWorldBook:_getMyWorldBook()}));
  var cs=document.getElementById('chat-status');if(cs)cs.innerHTML='AI思考中<span class=\"thinking-dots\"><span></span><span></span><span></span></span>'
}
function scrollChat(){var c=document.getElementById('chat-msgs');setTimeout(function(){c.scrollTop=c.scrollHeight},50)}
function mRetrySend(){var last=window._lastUserInput||'';if(last){document.getElementById('chat-input').value=last;sendMsg()}else{toast('无上一轮输入可重试','info')}}

function getMComfort(){ try{ return JSON.parse(localStorage.getItem('mvp_comfort')||'{"flash":true,"audio":true,"distort":true,"jumpscare":true,"lock":true}') }catch(e){ return {flash:true,audio:true,distort:true,jumpscare:true,lock:true} } }
function setMComfort(c){ localStorage.setItem('mvp_comfort',JSON.stringify(c)) }
function saveMComfort(){
  var c={flash:document.getElementById('m-comfort-flash').checked,audio:document.getElementById('m-comfort-audio').checked,distort:document.getElementById('m-comfort-distort').checked,jumpscare:document.getElementById('m-comfort-jumpscare').checked,lock:document.getElementById('m-comfort-lock').checked};
  setMComfort(c);
}
function loadMComfortUI(){
  var c=getMComfort();
  ['flash','audio','distort','jumpscare','lock'].forEach(function(k){
    var cb=document.getElementById('m-comfort-'+k);if(cb)cb.checked=c[k]!==false;
  });
}
function mShouldPlay(type){
  var c=getMComfort();
  if(['flash_red','screen_shake','glitch_text','vignette_pulse'].indexOf(type)>=0)return c.flash!==false;
  if(['sound_fx','bg_music','sudden_silence','heartbeat_warm','music_box'].indexOf(type)>=0)return c.audio!==false;
  if(['screen_blur','blood_edge','color_tone','breathing'].indexOf(type)>=0)return c.distort!==false;
  if(['portrait_popup','clue_image','scene_illustration','note_card','ending_card','binary_choice','fullscreen_text_popup','diary_flip','scene_transition'].indexOf(type)>=0)return c.jumpscare!==false;
  if(type==='input_lock')return c.lock!==false;
  return true;
}
function mDegradeNotice(desc){ var el=document.createElement('div');el.className='degrade-notice';el.textContent='⚠ 恐怖效果已关闭：'+desc;document.body.appendChild(el);setTimeout(function(){el.remove()},3000); }

// ═══ Hook效果渲染引擎（移动端） ═══
var _mActiveTimers=[];
function _mHookSchedule(fn,ms){var id=setTimeout(function(){var i=_mActiveTimers.indexOf(id);if(i>=0)_mActiveTimers.splice(i,1);fn()},ms);_mActiveTimers.push(id);return id}
function renderMHookEffects(effects,idx){
  if(idx>=effects.length)return;
  var ef=effects[idx],type=ef.type||'',params=ef.params||{};
  function next(){ renderMHookEffects(effects,idx+1); }
  if(!mShouldPlay(type)){
    if(['flash_red','screen_shake','glitch_text'].indexOf(type)>=0)mDegradeNotice(type.replace(/_/g,' '));
    else if(['portrait_popup','clue_image','ending_card','binary_choice'].indexOf(type)>=0){setTimeout(function(){mDegradeNotice(type.replace(/_/g,' '))},3000)}
    next();return;
  }
  switch(type){
    case 'flash_red': mEff_flash_red(params,next); break;
    case 'screen_shake': mEff_screen_shake(params,next); break;
    case 'golden_glow': mEff_golden_glow(params,next); break;
    case 'vignette_pulse': mEff_vignette_pulse(params,next); break;
    case 'blood_edge': mEff_blood_edge(params,next); break;
    case 'screen_blur': mEff_screen_blur(params,next); break;
    case 'glitch_text': mEff_glitch_text(params,next); break;
    case 'heartbeat_warm': mEff_golden_glow(params,next); break;
    case 'breathing': mEff_breathing(params,next); break;
    case 'portrait_popup': mEff_portrait_popup(params,next); break;
    case 'ending_card': mEff_ending_card(params,next); break;
    case 'clue_image': mEff_clue_image(params,next); break;
    case 'note_card': mEff_note_card(params,next); break;
    case 'typewriter': mEff_typewriter(params,next); break;
    case 'fullscreen_text': mEff_fullscreen_text(params,next); break;
    case 'chapter_title': mEff_chapter_title(params,next); break;
    case 'scene_transition': mEff_scene_transition(params,next); break;
    case 'diary_flip': mEff_diary_flip(params,next); break;
    case 'npc_chat': mEff_npc_chat(params,next); break;
    case 'npc_enter': mEff_npc_enter(params,next); break;
    case 'npc_exit': mEff_npc_exit(params,next); break;
    case 'fav_animation': mEff_fav_animation(params,next); break;
    case 'expression_change': next(); break;
    case 'binary_choice': mEff_binary_choice(params,next); break;
    case 'input_lock': mEff_input_lock(params,next); break;
    case 'reveal_tag': mEff_reveal_tag(params,next); break;
    case 'rule_reveal': mEff_rule_reveal(params,next); break;
    case 'border_color': mEff_border_color(params,next); break;
    case 'chat_bg': mEff_chat_bg(params,next); break;
    case 'status_flash': mEff_status_flash(params,next); break;
    case 'button_morph': next(); break;
    case 'petal_fall': mEff_petal_fall(params,next); break;
    case 'sunlight': mEff_sunlight(params,next); break;
    case 'music_box': mEff_music_box(params,next); break;
    case 'sudden_silence': mEff_sudden_silence(params,next); break;
    case 'color_tone': mEff_color_tone(params,next); break;
    case 'particles': mEff_particles(params,next); break;
    case 'bg_music': next(); break;
    case 'sound_fx': next(); break;
    case 'npc_comfort': mEff_portrait_popup(params,next); break;
    case 'warm_flashback': mEff_warm_flashback(params,next); break;
    case 'fullscreen_text_popup': mEff_fullscreen_text_popup(params,next); break;
    case 'dialogue_bubble': mEff_npc_chat(params,next); break;
    case 'scene_illustration': mEff_clue_image({image_url:params.image_url,caption:params.caption||''},next); break;
    case 'give_item': mEff_give_item(params,next); break;
    case 'attr_change': mEff_attr_change(params,next); break;
    case 'point_reward': mEff_point_reward(params,next); break;
    case 'local_flag': next(); break;
    default: next();
  }
}

function mEff_input_lock(p,next){
  var app=document.getElementById('app');if(!app){next();return}
  var text=p.text||'无法行动...',timeoutSec=Math.min(parseInt(p.timeout_seconds)||10,15);
  var inp=document.getElementById('chat-input'),sendBtn=document.getElementById('btn-send');
  var ov=document.createElement('div');ov.className='input-lock-overlay';ov.id='m-input-lock-el';
  ov.innerHTML='<button class="lock-close" id="mlock-x-btn">×</button><div class="lock-text">'+esc(text)+'</div><div class="lock-timer" id="mlock-timer">'+timeoutSec+'s</div>';
  if(p.unlock_method==='input'&&p.unlock_keyword)ov.innerHTML+='<input type="text" class="lock-keyword-input" id="mlock-kw-input" placeholder="输入关键字...">';
  var inputBar=app.querySelector('.input-bar');if(inputBar)inputBar.style.position='relative';app.appendChild(ov);
  if(inp)inp.disabled=true;if(sendBtn)sendBtn.disabled=true;
  var remaining=timeoutSec,unlocked=false;
  function doUnlock(){if(unlocked)return;unlocked=true;var el=document.getElementById('m-input-lock-el');if(el)el.remove();if(inp)inp.disabled=false;if(sendBtn)sendBtn.disabled=false;next();}
  var timer=setInterval(function(){remaining--;var tel=document.getElementById('mlock-timer');if(tel)tel.textContent=remaining+'s';if(remaining<=0){clearInterval(timer);doUnlock()}},1000);
  _mActiveTimers.push(timer);
  var safetyTimer=setTimeout(function(){clearInterval(timer);doUnlock()},timeoutSec*1000+500);
  _mActiveTimers.push(safetyTimer);
  var xBtn=ov.querySelector('#mlock-x-btn');if(xBtn)xBtn.onclick=function(){clearInterval(timer);clearTimeout(safetyTimer);doUnlock()};
  var kwInput=ov.querySelector('#mlock-kw-input');if(kwInput){kwInput.onkeydown=function(e){if(e.key==='Enter'){if(kwInput.value.trim()===p.unlock_keyword){clearInterval(timer);clearTimeout(safetyTimer);doUnlock()}else{kwInput.value='';kwInput.placeholder='错误，请重试'}}}}

function doSave(){
  var msgs=[];document.querySelectorAll('#chat-msgs .chat-msg').forEach(function(c){
    var role=c.classList.contains('user')?'user':(c.classList.contains('ai')?'ai':'system');
    msgs.push({role:role,content:c.querySelector('.bubble')?c.querySelector('.bubble').textContent:c.textContent})
  });
  _fetch('/api/saves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot_name:'存档 '+new Date().toLocaleTimeString(),turn_number:_turnCount,recent_messages:msgs})}).then(function(d){if(d.ok)toast('已保存','success')})
}
function loadSaves(){
  _fetch('/api/saves').then(function(d){
    var html='';(d.saves||[]).forEach(function(s){html+='<div class="list-item" onclick="loadSave('+s.id+')"><div><div class="li-title">'+esc(s.slot_name)+'</div><div class="li-sub">回合'+s.turn_number+' · '+esc(s.created_at||'')+'</div></div><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();delSave('+s.id+')">删</button></div>'});
    document.getElementById('saves-list').innerHTML=html||'<div class="loading">暂无存档</div>'
  })
}
function openSaves(){navigateTo('pg-saves')}
function loadSave(id){showConfirm('加载存档将覆盖当前进度？',function(){
  fetch('/api/saves/'+id,{headers:{'Authorization':'Bearer '+_auth()}}).then(function(r){return r.json()}).then(function(d){
    if(!d.save)return toast('存档无效','error');
    window._savedMessages=d.save.recent_messages||[];
    fetch('/api/saves/upload',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_auth()},body:JSON.stringify({slot_name:'loaded',save_data:d.save})}).then(function(){navigateTo('pg-chat')})
  })
})}
function delSave(id){showConfirm('确定删除此存档？',function(){fetch('/api/saves/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+_auth()}}).then(function(){loadSaves()})})}

// ═══ 个人中心 ═══
function loadProfile(){
  fetch('/api/user/profile',{headers:{'Authorization':'Bearer '+_auth()}}).then(function(r){return r.json()}).then(function(d){
    var h='<div style="text-align:center;margin-bottom:20px"><div style="font-size:48px">👤</div><div style="font-size:18px;font-weight:700">'+esc(d.username||'')+'</div><div style="font-size:12px;color:var(--text2)">'+esc(d.player_id||'')+'</div></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px"><div style="padding:12px;background:var(--card);border-radius:10px;text-align:center"><div style="font-size:22px;color:var(--gold);font-weight:700">'+(d.points||0)+'</div><div style="font-size:11px;color:var(--text2)">积分</div></div><div style="padding:12px;background:var(--card);border-radius:10px;text-align:center"><div style="font-size:22px;color:var(--gold);font-weight:700">'+(d.sign_in_streak||0)+'</div><div style="font-size:11px;color:var(--text2)">连续签到(天)</div></div></div>';
    h+='<button class="btn btn-gold btn-block" onclick="doSignIn()">签到领积分</button>';
    document.getElementById('profile-content').innerHTML=h
  })
}
function doSignIn(){fetch('/api/user/sign-in',{method:'POST',headers:{'Authorization':'Bearer '+_auth()}}).then(function(r){return r.json()}).then(function(d){if(d.ok)toast('签到成功 +'+d.bonus,'success');else toast(d.error||'签到失败','error');loadProfile()})}

// ═══ 变量面板 ═══
function renderVars(){
  var tags=_lastTags||{},html='',cats={world:'当前副本',map:'地图',rule:'规则',character:'角色',item:'物品'};
  for(var ck in cats){var list=tags[ck]||[];if(!list.length)continue;html+='<div style="font-weight:700;color:var(--gold);margin:8px 0 4px;font-size:13px">'+cats[ck]+'</div>';for(var i=0;i<list.length;i++){var t=list[i];html+='<div style="padding:6px 8px;margin:2px 0;background:var(--card);border-radius:6px;font-size:12px;border-left:3px solid var(--gold)">'+esc(t.tag_name||'')+'<br><span style="color:var(--text2);font-size:11px">'+esc((t.tag_hint||'').substring(0,40))+'</span></div>'}}
  document.getElementById('vars-content').innerHTML=html||'暂无变量数据'
}
function renderWorldBook(){
  var html='<div style="margin-bottom:12px"><b style="color:var(--gold)">🌐 模板世界书</b></div>';
  var wb=_worldBook||[];
  if(wb.length){wb.forEach(function(e){html+='<div style="padding:6px;margin:4px 0;background:var(--card);border-radius:6px;font-size:11px;border-left:3px solid '+(e.constant?'#4af':'var(--gold)')+'">'+(e.constant?'🔵':'🟢')+' <span style="color:var(--text2)">['+(e.keys||[]).join(',')+']</span> '+esc((e.content||'').substring(0,60))+'</div>'})}else{html+='<div style="color:var(--text2);font-size:12px">（空）</div>'}
  html+='<div style="margin:16px 0 8px"><b style="color:var(--gold)">📝 我的世界书</b> <button class="btn btn-sm btn-gold" onclick="openMyWbEditor()">+</button></div>';
  var myWb=_getMyWb();
  if(myWb.length){myWb.forEach(function(e,i){if(!e.enabled)return;html+='<div class="list-item" onclick="openMyWbEditor('+i+')"><div><div class="li-title" style="font-size:12px">'+(e.constant?'🔵':'🟢')+' ['+(e.keys||[]).join(',')+']</div><div class="li-sub">'+esc((e.content||'').substring(0,50))+'</div></div><span style="font-size:11px;color:var(--text2)">编辑</span></div>'})}else{html+='<div style="color:var(--text2);font-size:12px">（空）点击+添加</div>'}
  document.getElementById('wb-content').innerHTML=html
}
function _getMyWb(){try{return JSON.parse(localStorage.getItem('mvp_my_worldbook')||'[]')}catch(e){return[]}}
function openMyWbEditor(idx){
  var myWb=_getMyWb(),isNew=idx===undefined,entry=isNew?{keys:[],content:'',constant:false,enabled:true}:myWb[idx]||{};
  var html='<h3>'+(isNew?'新增':'编辑')+'世界书</h3>';
  html+='<div class="m-input-row"><label>触发关键词(逗号分隔)</label><input type="text" id="_wbkeys" class="m-input" value="'+esc((entry.keys||[]).join(','))+'"></div>';
  html+='<div class="m-input-row"><label>内容</label><textarea id="_wbcontent" class="m-input" style="min-height:80px">'+esc(entry.content||'')+'</textarea></div>';
  html+='<div class="m-input-row"><label><input type="checkbox" id="_wbconst" '+(entry.constant?'checked':'')+'> 常驻(蓝灯)</label></div>';
  html+='<div class="modal-btns">'+(isNew?'':'<button class="btn btn-sm" style="background:#8b2020;color:#fce8d0" onclick="_delWb('+idx+');closeModal(\'modal-wbeditor\');renderWorldBook()">删除</button>')+'<button class="btn btn-outline btn-sm" onclick="closeModal(\'modal-wbeditor\')">取消</button><button class="btn btn-primary btn-sm" onclick="_saveWb('+idx+')">保存</button></div>';
  var modal=document.createElement('div');modal.className='modal-overlay active';modal.id='modal-wbeditor';
  modal.innerHTML='<div class="modal">'+html+'</div>';modal.onclick=function(e){if(e.target===modal)modal.remove()};
  document.body.appendChild(modal)
}
function _saveWb(idx){var myWb=_getMyWb(),keys=document.getElementById('_wbkeys').value.split(',').map(function(s){return s.trim()}).filter(Boolean),content=document.getElementById('_wbcontent').value.trim(),constant=document.getElementById('_wbconst').checked;if(!content)return;var entry={keys:keys,content:content,constant:constant,enabled:true};if(idx===undefined||idx>=myWb.length)myWb.push(entry);else myWb[idx]=entry;localStorage.setItem('mvp_my_worldbook',JSON.stringify(myWb));document.getElementById('modal-wbeditor').remove();renderWorldBook();toast('保存成功','success')}
function _delWb(idx){var myWb=_getMyWb();myWb.splice(idx,1);localStorage.setItem('mvp_my_worldbook',JSON.stringify(myWb));renderWorldBook();toast('已删除','info')}

// ═══ 编辑/回滚消息 ═══
function editMsg(btn){
  var msgEl=btn.closest('.chat-msg'),bubble=msgEl.querySelector('.bubble'),orig=bubble.textContent;
  var ta=document.createElement('textarea');ta.value=orig;ta.className='m-input';ta.style.cssText='min-height:50px;font-size:13px;margin-bottom:6px';
  var save=document.createElement('button');save.textContent='确认';save.className='btn btn-sm btn-primary';save.style.marginRight='6px';
  var cancel=document.createElement('button');cancel.textContent='取消';cancel.className='btn btn-sm btn-outline';
  bubble.innerHTML='';bubble.appendChild(ta);bubble.appendChild(save);bubble.appendChild(cancel);
  save.onclick=function(){var t=ta.value.trim();if(!t)return;bubble.textContent=t;bubble.innerHTML+='<div class="msg-actions"><button class="msg-act" onclick="editMsg(this)">✎</button><button class="msg-act" onclick="rollbackMsg(this)">↩</button></div>';sendEditedMsg(t)};
  cancel.onclick=function(){bubble.textContent=orig;bubble.innerHTML+='<div class="msg-actions"><button class="msg-act" onclick="editMsg(this)">✎</button><button class="msg-act" onclick="rollbackMsg(this)">↩</button></div>'}
}
function sendEditedMsg(text){
  if(!_ws||_ws.readyState!==WebSocket.OPEN||_busy)return;
  _busy=true;document.getElementById('btn-send').style.display='none';document.getElementById('btn-stop').style.display='flex';
  var sk=document.createElement('div');sk.className='skeleton';sk.innerHTML='<div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div>';
  document.getElementById('chat-msgs').appendChild(sk);scrollChat();
  var m1=LG.getS('model1','deepseek-v4-flash'),m2=LG.getS('model2','deepseek-v4-pro'),ak1=_apikey1||LG.getS('apikey1',''),ak2=_apikey2||LG.getS('apikey2','');if(!ak2)ak2=ak1;
  window._lastUserInput=text;
  _ws.send(JSON.stringify({type:'user_turn',userInput:text,apiKey1:ak1,apiKey2:ak2,modelSmall:m1,modelLarge:m2,nValue:_nValue,myWorldBook:_getMyWorldBook()}));
  var cs2=document.getElementById('chat-status');if(cs2)cs2.innerHTML='AI思考中<span class=\"thinking-dots\"><span></span><span></span><span></span></span>'
}
function rollbackMsg(btn){showConfirm('回滚到此消息之前？该消息之后的所有进度将丢失。',function(){var turn=btn.closest('.chat-msg').getAttribute('data-turn')||_turnCount;fetch('/api/rollback/'+turn,{method:'POST',headers:{'Authorization':'Bearer '+_auth()}}).then(function(r){return r.json()}).then(function(d){if(d.ok){toast('已回滚','info');navigateTo('pg-home');setTimeout(function(){navigateTo('pg-chat')},500)}else toast(d.error||'回滚失败','error')})})}

// ═══ 管理面板 ═══
function adminTab(tab){
  var c=document.getElementById('admin-content'),token=_auth(),h='';
  var fetchAdmin=function(url,cb){fetch(url,{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.json()}).then(cb)};
  if(tab==='users'){fetchAdmin('/api/admin/users?page=1&size=20',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">用户管理</div>';if(d.users)for(var i=0;i<d.users.length;i++){var u=d.users[i];h+='<div class="list-item"><div><div class="li-title">'+esc(u.username)+'</div><div class="li-sub">积分:'+(u.points||0)+' | '+(u.is_banned?'已封禁':'正常')+'</div></div></div>'}c.innerHTML=h})}
  else if(tab==='codes'){fetchAdmin('/api/admin/exchange-codes',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">兑换码管理</div>';h+='<div class="m-input-row"><label>数量</label><input type="number" id="ad-code-count" class="m-input" value="3"></div><div class="m-input-row"><label>积分</label><input type="number" id="ad-code-pts" class="m-input" value="500"></div><div class="m-input-row"><label>批次名</label><input type="text" id="ad-code-batch" class="m-input" value="batch1"></div><button class="btn btn-gold btn-sm" onclick="genCodes()">生成兑换码</button>';if(d.codes)for(var i=0;i<d.codes.length;i++){var cd=d.codes[i];h+='<div class="list-item" style="font-size:11px"><span>'+cd.code.substring(0,20)+'... | '+cd.points+'分 | '+(cd.is_used?'已用':'未用')+'</span></div>'}c.innerHTML=h})}
  else if(tab==='comments'){fetchAdmin('/api/admin/comments?status=all',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">评论管理</div>';if(d.comments)for(var i=0;i<d.comments.length;i++){var cm=d.comments[i];h+='<div class="list-item"><div><div class="li-title" style="font-size:13px">'+esc(cm.username)+'</div><div class="li-sub">'+esc((cm.content||'').substring(0,60))+'</div></div><button class="btn btn-sm btn-outline" onclick="delCmt('+cm.id+')">删</button></div>'}c.innerHTML=h})}
  else if(tab==='suggestions'){fetchAdmin('/api/admin/suggestions',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">建议列表</div>';if(d.suggestions)for(var i=0;i<d.suggestions.length;i++){var sg=d.suggestions[i];h+='<div class="list-item"><div><div class="li-title" style="font-size:13px">'+esc(sg.username)+' · '+esc(sg.category)+'</div><div class="li-sub">'+esc((sg.content||'').substring(0,60))+'</div><div class="li-sub" style="color:var(--accent)">状态: '+esc(sg.status||'pending')+'</div></div></div>'}c.innerHTML=h})}
  else if(tab==='announce'){fetchAdmin('/api/admin/announcements',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">系统公告</div>';h+='<textarea id="ad-announce" class="m-input" style="min-height:60px" placeholder="公告内容..."></textarea><button class="btn btn-gold btn-sm" onclick="postAnnounce()" style="margin-top:8px">发布</button>';if(d.announcements)for(var i=0;i<d.announcements.length;i++){var an=d.announcements[i];h+='<div class="list-item"><div><div class="li-sub">'+esc((an.content||'').substring(0,80))+'</div><div class="li-sub" style="color:var(--text2)">'+(an.is_active?'活跃':'已下线')+'</div></div></div>'}c.innerHTML=h})}
  else if(tab==='stats'){fetchAdmin('/api/admin/stats',function(d){h='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">系统统计</div>';h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';['total_users','total_templates','total_comments','total_points_issued','today_active'].forEach(function(k){h+='<div style="padding:12px;background:var(--card);border-radius:10px;text-align:center"><div style="font-size:22px;color:var(--gold);font-weight:700">'+(d[k]||0)+'</div><div style="font-size:11px;color:var(--text2)">'+k+'</div></div>'});h+='</div>';c.innerHTML=h})}
}
function genCodes(){var cnt=document.getElementById('ad-code-count').value,pts=document.getElementById('ad-code-pts').value,batch=document.getElementById('ad-code-batch').value;fetch('/api/admin/exchange-codes',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_auth()},body:JSON.stringify({count:parseInt(cnt),points:parseInt(pts),batch_id:batch})}).then(function(r){return r.json()}).then(function(d){if(d.ok)toast('生成'+d.count+'个兑换码','success')})}
function postAnnounce(){var c=document.getElementById('ad-announce').value.trim();if(!c)return;fetch('/api/admin/announcements',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_auth()},body:JSON.stringify({content:c})}).then(function(r){return r.json()}).then(function(d){if(d.ok)toast('公告已发布','success')})}
function delCmt(id){showConfirm('确定删除此评论？',function(){fetch('/api/admin/comments/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+_auth()}}).then(function(){adminTab('comments')})})}

// ═══ 加载公告 ═══
window.addEventListener("load",function(){fetch("/api/announcements").then(function(r){return r.json()}).then(function(d){if(d.announcement){var e=document.getElementById("home-announce");e.textContent=d.announcement.content;e.style.display="block"}})});
</script></body></html>
